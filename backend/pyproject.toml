[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-writing-agent"
version = "0.1.0"
description = "An AI-powered blog writing agent built with LangGraph and OpenAI."
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2",
    "langchain-openai>=1.1",
    "langgraph>=1.1",
    "langgraph-checkpoint-postgres>=2.0.0",
    "openai>=2.0",
    "tavily-python>=0.7",
    "streamlit>=1.56",
    "pandas>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "psycopg[binary,pool]>=3.1",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "chromadb>=0.4.0,<0.6.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
bwa-frontend = "blog_agent.frontend.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
