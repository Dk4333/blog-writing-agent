services:
  # FastAPI backend
  - type: web
    name: blog-agent-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://blog-agent-frontend-64v3.onrender.com
    healthCheckPath: /api/health
    # RAG Storage Volume Configuration (Requires Render Paid Starter plan or above)
    # disk:
    #   name: rag-reference-storage
    #   mountPath: /app/backend/storage
    #   sizeGB: 1

  # React frontend (static sites are always free on Render)
  - type: web
    name: blog-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://blog-agent-backend-sj89.onrender.com/api/*
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
