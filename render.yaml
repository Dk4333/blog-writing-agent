services:
  # FastAPI backend
  - type: web
    name: blog-agent-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://blog-agent-frontend-64v3.onrender.com
    healthCheckPath: /api/health

  # React frontend (static sites are always free on Render)
  - type: web
    name: blog-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://blog-agent-backend-sj89.onrender.com
    routes:
      # Support client-side routing (SPA fallback)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
