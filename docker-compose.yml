services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8088:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=   # nginx proxies /api/ to backend — no host needed
    ports:
      - "3080:80"
    depends_on:
      - backend
    restart: unless-stopped
